services:
  detector:
    build: .
    image: contador-produtos-api:latest
    container_name: contador-produtos-api
    ports:
      - "${PORTA:-8000}:8000"
    environment:
      # tamanho máximo da imagem aceita (MB)
      TAMANHO_MAX_MB: "20"
      WORKER_URLS: "http://worker1:8001,http://worker2:8001"
    depends_on:
      worker1:
        condition: service_healthy
      worker2:
        condition: service_healthy
    restart: unless-stopped
    # CLIP + torch usam ~1,5 GB de RAM em uso; o limite evita o container derrubar a máquina
    deploy:
      resources:
        limits:
          memory: 4g

  worker1:
    image: contador-produtos-api:latest
    command: ["uvicorn", "worker:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      PORT: "8001"
    restart: unless-stopped

  worker2:
    image: contador-produtos-api:latest
    command: ["uvicorn", "worker:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      PORT: "8001"
    restart: unless-stopped
