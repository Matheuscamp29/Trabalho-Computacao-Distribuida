services:
  detector:
    build: .
    image: contador-produtos-api:latest
    container_name: contador-produtos-api
    ports:
      - "${PORTA:-8000}:8000"
    environment:
      TAMANHO_MAX_MB: "20"
      WORKER_URLS: "http://worker1:8001,http://worker2:8001"
    depends_on:
      worker1:
        condition: service_healthy
      worker2:
        condition: service_healthy
    restart: unless-stopped

  worker1:
    image: contador-produtos-api:latest
    command: ["python", "worker.py"]
    environment:
      PORT: "8001"
      WORKER_ID: "worker1"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g

  worker2:
    image: contador-produtos-api:latest
    command: ["python", "worker.py"]
    environment:
      PORT: "8001"
      WORKER_ID: "worker2"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g
